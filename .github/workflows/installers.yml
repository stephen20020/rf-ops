# Builds the installers: Linux .deb (stage station + rfops + optional local server) and the
# Windows x64 MSI (stage station + rfops). Runs on a version tag (v0.2.0) or by hand
# (Actions → Installers → Run workflow). Tagged builds are attached to the GitHub release.
name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    # Built on Ubuntu 22.04 so it also installs on Debian 12 and newer Ubuntu (older glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web client
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p rfops-server -p rfops-cli
      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p rfops-cli --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: rfops-deb
          path: target/debian/*.deb
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb

  msi:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rfops.exe
        run: cargo build --release --locked -p rfops-cli
      - name: WiX 3
        run: choco install wixtoolset --version 3.14.1 -y --no-progress
      - name: Package .msi
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          & "$wix\candle.exe" -nologo -arch x64 "-dVersion=$version" "-dExe=target\release\rfops.exe" `
              "-dStation=deploy\windows\rfops-station.ps1" deploy\windows\rfops.wxs -o rfops.wixobj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$wix\light.exe" -nologo -sice:ICE57 -sice:ICE91 rfops.wixobj -o "rfops-$version-x64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: rfops-msi
          path: "*.msi"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.msi"
