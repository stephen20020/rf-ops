  - { name: Seth, notes: "Vocal. Sennheiser 1, Andrew Taylor's mix (ME TBC)" }
  - { name: Josh Patterson, notes: "Guest. Sennheiser 2, ME 15 (choir wedge)" }

# Guitar wireless: packs paired with their receivers (who plays which guitar is TBC).
devices:
  - { label: GLXD1-1, kind: guitar, base: GLXD6-1 }
  - { label: GLXD1-2, kind: guitar, base: GLXD6-2 }
  - { label: GLXD1+-1, kind: guitar, base: GLXD6+-1 }

# IEM transmitter → ME-1 mix for this show. RX1, RX3 and RX6 all listen to TX1.
mixes:
  TX1: ME 1
  TX2: ME 2
  TX4: ME 4
  TX5: ME 5
  TX7: Console mix
  TX8: ME 16
  TX10: ME 3

songs:
  - { title: Concert (before handoff) }
  - title: I Will Follow Jesus / Lace Up Your Boots
    passes:
      - "RX10: Helen -> Shosh"
  - { title: Concert (after handoff) }

