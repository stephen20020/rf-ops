# HF 2026 afternoon, Friday. From the Homestead Fair afternoon IEM & ME-1 sheet (latest owner
# document). Load it with:  rfops show import examples/hf2026-afternoon-friday.yaml
# Song list is a placeholder until the run order is final: edit the titles and pc numbers.

show: HF Afternoon — Friday
event: Homestead Fair 2026
timezone: America/Chicago
set: afternoon

people:
  - { name: Enoch, notes: Drums }
  - { name: Aaron, notes: Bass }
  - { name: Drummer 2, notes: Drums }
  - { name: Tim, notes: Nord }
  - { name: Judah, notes: Vocal }
  - { name: Drummer 3, notes: Drums }
  - { name: Stephen, notes: Choir director }
  - { name: Sam, notes: Orchestra director }
  - { name: Helen, notes: Vocal }
  - { name: Shosh, notes: Vocal }
